site_name: GridBank SDK
site_description: Documentation for the GridBank Partner API and Enterprise API, and their Python and JavaScript SDKs
repo_url: https://github.com/gridbank/gridbank-sdk
repo_name: gridbank/gridbank-sdk
edit_uri: ""

theme:
  name: material
  logo: assets/images/logo.png
  palette:
    - scheme: light
      primary: custom
      accent: custom
  features:
    - content.code.copy
    - navigation.tabs
    - navigation.sections
    - toc.follow
    - content.tabs.link
    - search.suggest
    - search.highlight

markdown_extensions:
  - tables
  - admonition
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences

nav:
  - Home: index.md
  - Partner API:
    - Overview: partner/index.md
  - Enterprise API:
    - Overview: enterprise/index.md
    - Getting Started: enterprise/getting-started.md
    - API Reference: enterprise/api-reference.md
    - Errors: enterprise/errors.md
    - Python SDK:
      - Overview: enterprise/python/overview.md
      - Installation: enterprise/python/installation.md
      - Client: enterprise/python/client.md
      - Methods: enterprise/python/methods.md
      - Examples: enterprise/python/examples.md
    - JavaScript SDK:
      - Overview: enterprise/javascript/overview.md
      - Installation: enterprise/javascript/installation.md
      - Client: enterprise/javascript/client.md
      - Methods: enterprise/javascript/methods.md
      - Examples: enterprise/javascript/examples.md
    - Advanced:
      - Pagination: enterprise/advanced/pagination.md
      - Rate Limits: enterprise/advanced/rate-limits.md
    - OpenAPI Explorer: openapi-viewer.html

plugins:
  - search

extra_css:
  - assets/extra.css
